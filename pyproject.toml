[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada-assets"
version = "0.1.0"
description = "MuJoCo models for the ADA robot-assisted feeding system"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    # 3.14 is the MuJoCo ssrobot requires exactly; the lockfile below tests that version.
    "mujoco>=3.14",
]

[tool.hatch.metadata]
allow-direct-references = true

# Hatchling includes every file under the package, so the models, meshes, and
# ssrobot.toml ship in the wheel without a force-include.
[tool.hatch.build.targets.wheel]
packages = ["src/ada_assets"]

[project.urls]
Homepage = "https://github.com/personalrobotics/ada_assets"
Repository = "https://github.com/personalrobotics/ada_assets"
Issues = "https://github.com/personalrobotics/ada_assets/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# Develop and test against the exact MuJoCo ssrobot pins, so CI checks what ssrobot runs.
constraint-dependencies = ["mujoco==3.14.0"]
