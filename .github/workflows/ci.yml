name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"  # every uv command here must use uv.lock as committed
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The uv that wrote uv.lock; another release may write a different lock revision.
          version: "0.12.15"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --locked: fail if uv.lock no longer matches pyproject.toml, instead of re-resolving.
        run: uv sync --locked --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest tests/ -v

  wheel:
    # The wheel is what users install: it must carry every model, mesh, and both packages'
    # ssrobot.toml, and regenerate the committed models.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - name: The wheel contains every package file
        run: |
          python3 - <<'PY'
          import pathlib, sys, zipfile
          source = pathlib.Path("src")
          expected = {
              p.relative_to(source).as_posix()
              for p in source.rglob("*")
              if p.is_file() and "__pycache__" not in p.parts
          }
          (wheel,) = pathlib.Path("dist").glob("*.whl")
          shipped = {n for n in zipfile.ZipFile(wheel).namelist() if n.startswith("ada_assets/")}
          missing = sorted(expected - shipped)
          print(f"{wheel.name}: {len(shipped)} package files, {len(expected)} in src/")
          for name in missing:
              print(f"missing from the wheel: {name}")
          manifests = {"ada_assets/ssrobot.toml", "ada_assets/models/ssrobot.toml"}
          sys.exit(1 if missing or not manifests <= shipped else 0)
          PY
      - name: The installed wheel regenerates the committed models
        # The wheel alone in a clean environment, at the MuJoCo uv.lock pins, run outside the
        # checkout so nothing is imported from src/.
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 wheel-env
          uv pip install --python wheel-env "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" "mujoco==3.14.0"
          wheel-env/bin/python - "$GITHUB_WORKSPACE/src/ada_assets/models" <<'PY'
          import pathlib, sys, tempfile
          import ada_assets
          from ada_assets.assembly import generate
          committed = pathlib.Path(sys.argv[1])
          assert "site-packages" in ada_assets.__file__, ada_assets.__file__
          with tempfile.TemporaryDirectory() as out:
              regenerated = generate(pathlib.Path(out))
              differ = sorted(n for n, p in regenerated.items() if p.read_bytes() != (committed / n).read_bytes())
          print(f"{len(regenerated)} models regenerated from {ada_assets.__file__}: {sorted(regenerated)}")
          for name in differ:
              print(f"differs from the committed model: {name}")
          sys.exit(1 if differ else 0)
          PY
      - name: ssrobot doctor on the built wheel
        # Each package as ssrobot loads it, from the installed wheel, at a pinned ssrobot.
        run: |
          for package in src/ada_assets src/ada_assets/models; do
            uvx --python 3.12 \
              --from "git+https://github.com/personalrobotics/ssrobot@c17ce05bb12a26b65893e5561ecc451a0444c11d" \
              ssrobot doctor "$package" --wheel "$(ls dist/*.whl)"
          done

  notify-robot-code:
    needs: [test, wheel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ROBOT_CODE_DISPATCH_TOKEN: ${{ secrets.ROBOT_CODE_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch integration run
        if: env.ROBOT_CODE_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ env.ROBOT_CODE_DISPATCH_TOKEN }}
          repository: personalrobotics/robot-code
          event-type: sibling-updated
          client-payload: '{"repo":"${{ github.event.repository.name }}","sha":"${{ github.sha }}"}'
