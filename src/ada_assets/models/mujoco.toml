# MujocoRuntime settings for the bare-hand ADA (ssrobot.toml here; see ssrobot's
# docs/mujoco.md). It starts at the "resting" keyframe, where this model's fingers are
# open, and drives the fingers exactly as ../mujoco.toml does, whose comments give the
# controls' and the completion detector's sources: the fingers and their actuators are the
# same in both models.
schema = "ssrobot.MujocoProfile"
version = 2
keyframe = "resting"

[[grippers]]
gripper = "gripper"
actuators = [
  { actuator = "act_finger_1", closed = 1.35, open = 0.0 },
  { actuator = "act_finger_2", closed = 1.35, open = 0.0 },
]
completion = { goal_tolerance = 0.01, stall_delta = 0.00015625, stall_dwell_ns = 500_000_000 }

# When arm_q counts as at rest in this simulation: every joint within its variation for
# 370 ms, read every 2 ms control tick with none dropped. The variation is declared, the
# bound on what counts as still: each joint within (2, 2, 2, 2, 2, 2) steps of
# 2*pi/2^17 rad, in joint order, the same JACO2 joints and bound as ../mujoco.toml. The
# dwell is measured against it for this model, whose arm carries no articutool, so
# ../mujoco.toml's 378 ms is not evidence for it: one tick longer than the longest
# interval the readings, exactly as observed, stayed within the variation and then moved
# (368 ms), over reaches, out-and-backs through zero velocity, pauses, and single-joint
# moves from the keyframe and the four named configurations, judged from each
# trajectory's end. The arm cannot raise the cylinder by its first joint, so no payload
# trial is judged. MuJoCo source's values; the hardware is unmeasured. Evidence:
# evidence/ada_hand-mujoco-rest.json (sha256
# 65a9494032daa5454a442b1baef20db7c4b1b3e947a6e17119223e418933d1dc), written by
# ssrobot's scripts/calibrate_rest.py --robot ada_hand at ssrobot 8711dd8bf5bd on this
# repository at 8ddf90643bd1, 28 of 28 judged trials passing.
[[rest]]
channel = "arm_q"
criteria = { max_gap_ns = 2000000, dwell_ns = 370000000, variation = [9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05], source = "MuJoCo source's values: variation declared per joint ([9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05]), the bound on what counts as still; dwell one tick longer than the longest interval that looked still and then moved, 368000000 ns, judged from each trajectory's end; measured by ssrobot scripts/calibrate_rest.py at ssrobot 8711dd8bf5bd on personalrobotics/ada_assets@8ddf90643bd1; the hardware is unmeasured; evidence/ada_hand-mujoco-rest.json sha256 65a9494032daa5454a442b1baef20db7c4b1b3e947a6e17119223e418933d1dc" }
