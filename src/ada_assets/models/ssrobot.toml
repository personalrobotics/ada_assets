# ADA with an empty hand: the robot of ../ssrobot.toml without the articutool, for grasping
# objects with the fingers. Its arm, gripper, named configurations, and JACO2 joint limits
# are the same declarations as there, with the same sources; keep the two in step. Its end
# effector is the palm grasp site, sstsr's canonical parallel-jaw frame (jaco2.xml).
# The package root is this directory, which holds the model and its meshes.
schema = "ssrobot.package"
version = 1
robot = "ada_hand"
canonical_model = "mjcf"

[[models]]
name = "mjcf"
format = "mjcf"
path = "ada_hand.xml"

[[profiles]]
name = "sim"
runtime = "mujoco"
path = "mujoco.toml"

[[semantics.groups]]
name = "arm"
joints = ["j2n6s200_joint_1", "j2n6s200_joint_2", "j2n6s200_joint_3", "j2n6s200_joint_4", "j2n6s200_joint_5", "j2n6s200_joint_6"]

[[semantics.grippers]]
name = "gripper"
frame = "j2n6s200_link_6"
joints = ["j2n6s200_joint_finger_1", "j2n6s200_joint_finger_tip_1", "j2n6s200_joint_finger_2", "j2n6s200_joint_finger_tip_2"]
# Where the joints settle commanded fully open and fully closed on nothing: MuJoCo's
# values, the hardware is unmeasured. Measured by ssrobot scripts/calibrate_gripper.py
# at ssrobot 90676c05772 on personalrobotics/ada_assets@2d8f7972920e (MuJoCo
# 3.14.0); evidence/ada_hand-mujoco-gripper.json sha256 91f44243cdfc7f777ab13a73aa4a2dd3775467dbf56a87244c3f26a405766854
open_positions = [5.4820280672972064e-12, 0.0, 5.462468868187398e-12, 0.0]
closed_positions = [1.3499999929879352, 1.4006713506702923e-08, 1.3499999929879352, 1.4006713598753754e-08]

[[semantics.manipulators]]
name = "arm"
group = "arm"
base_frame = "j2n6s200_link_base"
tool_frame = "j2n6s200_link_6"
end_effector = "hand"

[[semantics.end_effectors]]
name = "hand"
frame = "palm_grasp_site"
gripper = "gripper"

# ADA's named poses, equal to the keyframes of the same name.
[[semantics.configurations]]
name = "resting"
group = "arm"
positions = [-1.86, 2.181, 0.364, -5.187, -0.47, -0.814]

[[semantics.configurations]]
name = "staging"
group = "arm"
positions = [-2.122, 4.496, 4.022, -4.71, -2.493, -1.926]

[[semantics.configurations]]
name = "above_plate"
group = "arm"
positions = [-2.579, 3.01, 1.77, -2.076, -1.791, 2.858]

[[semantics.configurations]]
name = "stow"
group = "arm"
positions = [-1.521, 2.601, 0.348, -4.0, 0.228, 3.879]

# The JACO2's hardware limits, as in ../ssrobot.toml, whose comment gives their sources.
[[semantics.joint_limits]]
joint = "j2n6s200_joint_1"
velocity = 0.6283185307179586
acceleration = 6.28
effort = 40.0

[[semantics.joint_limits]]
joint = "j2n6s200_joint_2"
velocity = 0.6283185307179586
acceleration = 6.28
effort = 80.0

[[semantics.joint_limits]]
joint = "j2n6s200_joint_3"
velocity = 0.6283185307179586
acceleration = 6.28
effort = 40.0

[[semantics.joint_limits]]
joint = "j2n6s200_joint_4"
velocity = 0.8377580409572781
acceleration = 8.38
effort = 20.0

[[semantics.joint_limits]]
joint = "j2n6s200_joint_5"
velocity = 0.8377580409572781
acceleration = 8.38
effort = 20.0

[[semantics.joint_limits]]
joint = "j2n6s200_joint_6"
velocity = 0.8377580409572781
acceleration = 8.38
effort = 20.0

# A runtime must confirm each of these.
[[semantics.commands]]
component = "arm"
kind = "joint"
mode = "position"

[[semantics.commands]]
component = "arm"
kind = "joint_trajectory"

[[semantics.commands]]
component = "gripper"
kind = "gripper"

[[semantics.channels]]
name = "arm_q"
quantity = "joint_position"
source = "arm"
shape = [6]
dtype = "float64"

[[semantics.channels]]
name = "arm_qd"
quantity = "joint_velocity"
source = "arm"
shape = [6]
dtype = "float64"

[[semantics.channels]]
name = "arm_qf"
quantity = "joint_effort"
source = "arm"
shape = [6]
dtype = "float64"

[[semantics.channels]]
name = "gripper_opening"
quantity = "gripper_opening"
source = "gripper"
shape = [1]
dtype = "float64"
