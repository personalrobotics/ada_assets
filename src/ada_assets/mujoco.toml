# MujocoRuntime settings for ADA (see ssrobot's docs/mujoco.md). The model's default
# state is not a valid pose (README), so MujocoRuntime starts at the "resting" keyframe.
# Each finger is driven through its tendon actuator, whose control runs from 0 (open) to
# 1.51. The fingertips meet at a tendon length of about 1.356, short of 1.51, so "closed"
# is 1.35: the fingers fully closed, just short of touching.
schema = "ssrobot.MujocoProfile"
version = 2
keyframe = "resting"

[[grippers]]
gripper = "gripper"
actuators = [
  { actuator = "act_finger_1", closed = 1.35, open = 0.0 },
  { actuator = "act_finger_2", closed = 1.35, open = 0.0 },
]
# A gripper command ends when its fingers' motion ends (personalrobotics/ssrobot#219), by
# this completion detector on the opening: it reached its target once within
# goal_tolerance of it; it stopped short once its openings over stall_dwell_ns vary by no
# more than stall_delta. The values are the defaults of Kinova's own finger action for
# the JACO2 (kinova-ros kinova_fingers_action.cpp, 924781d): a tolerance of 64 and a
# stall threshold of 1 over the fingers' 0 to 6400 range, and a 0.5 s stall interval. In
# MuJoCo, an empty close and an unobstructed open each reach their target with them.
completion = { goal_tolerance = 0.01, stall_delta = 0.00015625, stall_dwell_ns = 500_000_000 }

# When arm_q counts as at rest in this simulation: every joint within its variation for
# 378 ms, read every 2 ms control tick with none dropped. The variation is declared, the
# bound on what counts as still: each joint within (2, 2, 2, 2, 2, 2) steps of 2*pi/2^17
# rad, in joint order, carried over from personalrobotics/ssrobot#223. MuJoCo's settled
# state converges to solver or float tolerance, so it has no chatter to set a bound by
# (personalrobotics/ssrobot#224). The dwell is measured against it on the readings
# exactly as observed: one tick longer than the longest interval they stayed within it
# and then moved (376 ms), over reaches, out-and-backs through zero velocity, pauses,
# and single-joint moves, judged from each trajectory's end. MuJoCo source's values; the
# hardware is unmeasured. Evidence: evidence/mujoco-rest.json (sha256
# bd059c9c0613799339f49aed981645fb06feb6d02e92183dd608979c6ca4b2e9), written by
# ssrobot's scripts/calibrate_rest.py --robot ada --commit ada=55a02bdb43be at ssrobot
# ebecbcb5f810, 28 of 28 judged trials passing.
[[rest]]
channel = "arm_q"
criteria = { max_gap_ns = 2000000, dwell_ns = 378000000, variation = [9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05], source = "MuJoCo source's values: variation declared per joint ([9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05]), the bound on what counts as still; dwell one tick longer than the longest interval that looked still and then moved, 376000000 ns, judged from each trajectory's end; measured by ssrobot scripts/calibrate_rest.py at ssrobot ebecbcb5f810 on personalrobotics/ada_assets@55a02bdb43be; the hardware is unmeasured; evidence/mujoco-rest.json sha256 bd059c9c0613799339f49aed981645fb06feb6d02e92183dd608979c6ca4b2e9" }
